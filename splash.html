<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Orbit</title>

    <link rel="stylesheet" href="css/splash.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- Universe -->

    <div class="universe">

        <!-- Stars / Entertainment Worlds -->

      <!-- Entertainment Worlds -->

<div class="star movie">

    <i class="fa-solid fa-film"></i>

    <span>Movies</span>

</div>

<div class="star series">

    <i class="fa-solid fa-tv"></i>

    <span>Series</span>

</div>

<div class="star anime">

    <i class="fa-solid fa-dragon"></i>

    <span>Anime</span>

</div>

<div class="star music">

    <i class="fa-solid fa-music"></i>

    <span>Music</span>

</div>

        <!-- Orbit Ring -->

        <div class="orbit-ring"></div>

        <!-- Center -->

        <div class="center">

            <img
                src="image/splash.png"
                alt="Orbit Logo"
                class="orbit-logo">

            <h1>ORBIT</h1>

            <p>

                Different Worlds.

                <br>

                One Universe.

            </p>

        </div>

    </div>

    <script src="js/splash.js"></script>

</body>

</html>
